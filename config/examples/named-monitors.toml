# OPTIONAL: merge into your personal config, replacing the existing table.
# Replace these example names with `aerospace list-monitors` output.
# Device names retain their role when the laptop lid closes or a display leaves.
# Laptop: workspace 1. DELL: 2-8. Portrait: 9-10.
# Missing Portrait -> DELL -> laptop -> any remaining display.
# Missing DELL -> laptop -> any remaining display.
# Forced assignments disable manual whole-workspace moves to other monitors.
[workspace-to-monitor-force-assignment]
    1 = ['built-in', '^DELL P2723QE$', 1]
    2 = ['^DELL P2723QE$', 'built-in', 1]
    3 = ['^DELL P2723QE$', 'built-in', 1]
    4 = ['^DELL P2723QE$', 'built-in', 1]
    5 = ['^DELL P2723QE$', 'built-in', 1]
    6 = ['^DELL P2723QE$', 'built-in', 1]
    7 = ['^DELL P2723QE$', 'built-in', 1]
    8 = ['^DELL P2723QE$', 'built-in', 1]
    9 = ['^Portrait$', '^DELL P2723QE$', 'built-in', 1]
    10 = ['^Portrait$', '^DELL P2723QE$', 'built-in', 1]
