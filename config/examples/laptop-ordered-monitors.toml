# OPTIONAL: merge this table into your personal AeroSpace config.
# Do not install this as a complete config or add a duplicate table.
# Required left-to-right arrangement: laptop, work display, optional third display.
# Numbers are AeroSpace's spatial monitor order, not permanent hardware IDs.
# This does not depend on which display macOS calls "main".
# Three screens: 1 -> laptop, 2-8 -> screen 2, 9-10 -> screen 3.
# Two screens: 1 -> laptop, 2-10 -> screen 2.
# One screen: all -> the remaining display.
# Closing the laptop changes monitor order; this is not a clamshell-specific profile.
# Forced assignments disable manual whole-workspace moves to other monitors.
[workspace-to-monitor-force-assignment]
    1 = ['built-in', 1]
    2 = [2, 'built-in', 1]
    3 = [2, 'built-in', 1]
    4 = [2, 'built-in', 1]
    5 = [2, 'built-in', 1]
    6 = [2, 'built-in', 1]
    7 = [2, 'built-in', 1]
    8 = [2, 'built-in', 1]
    9 = [3, 2, 'built-in', 1]
    10 = [3, 2, 'built-in', 1]
